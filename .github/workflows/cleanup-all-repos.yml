name: Cleanup All Repositories

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: energy-tracker/home-assistant-energy-tracker
            retention_days: 28
            min_runs: 3
          - repository: energy-tracker/api-client-python
            retention_days: 28
            min_runs: 3
          - repository: energy-tracker/ioBroker.energy-tracker
            retention_days: 28
            min_runs: 3
          - repository: energy-tracker/github-automation
            retention_days: 7
            min_runs: 3
          - repository: energy-tracker/public-docs
            retention_days: 7
            min_runs: 3
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Clean up workflow runs for ${{ matrix.repository }}
        uses: ./actions/cleanup-workflow-runs
        with:
          repository: ${{ matrix.repository }}
          retention_days: ${{ matrix.retention_days }}
          min_runs: ${{ matrix.min_runs }}
          github_token: ${{ secrets.WORKFLOW_CLEANUP_TOKEN }}
