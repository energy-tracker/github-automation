name: Lock Closed Issues

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  lock-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: energy-tracker/home-assistant-energy-tracker
            days_before_lock: 3
          - repository: energy-tracker/api-client-python
            days_before_lock: 3
          - repository: energy-tracker/ioBroker.energy-tracker
            days_before_lock: 3
          - repository: energy-tracker/github-automation
            days_before_lock: 3
          - repository: energy-tracker/public-docs
            days_before_lock: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Lock closed issues for ${{ matrix.repository }}
        uses: ./actions/lock-closed-issues
        with:
          repository: ${{ matrix.repository }}
          days_before_lock: ${{ matrix.days_before_lock }}
          github_token: ${{ secrets.WORKFLOW_CLEANUP_TOKEN }}
